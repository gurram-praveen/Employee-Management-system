spring.application.name=employee-management-system
server.port=8080

# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:5122}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# Schema is created by database/schema.sql; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# CORS origins allowed for the frontend
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc.swagger-ui.path=/swagger-ui.html

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:change-me}
