services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: employee_db
      MYSQL_USER: ${DB_USERNAME:-ems_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ems-app-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ems-root-local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-ems-root-local}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-ems_app}
      DB_PASSWORD: ${DB_PASSWORD:-ems-app-local}
      DDL_AUTO: validate
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
